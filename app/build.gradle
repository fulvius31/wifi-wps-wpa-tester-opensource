import org.jetbrains.kotlin.gradle.dsl.JvmTarget
import groovy.xml.XmlSlurper

plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.kotlin.compose)
    alias(libs.plugins.kotlin.serialization)
    id 'kotlin-parcelize'
    id 'kotlin-kapt'
    id 'com.google.dagger.hilt.android'
    id 'com.diffplug.spotless'
    id 'io.gitlab.arturbosch.detekt'
    id 'checkstyle'
}

android {
    namespace 'sangiorgi.wps.opensource'
    compileSdk = 36

    defaultConfig {
        applicationId "sangiorgi.wps.opensource"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // Release signing is configured only when a keystore is supplied via env vars (CI secrets) or
    // gradle properties. Without it, release builds stay unsigned so local/CI builds without the
    // secret still succeed instead of shipping an unsigned APK as if it were release-ready.
    def releaseStoreFile = System.getenv("KEYSTORE_FILE") ?: project.findProperty("KEYSTORE_FILE")
    def hasReleaseSigning = releaseStoreFile != null

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStoreFile)
                storePassword System.getenv("KEYSTORE_PASSWORD") ?: project.findProperty("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS") ?: project.findProperty("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD") ?: project.findProperty("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            // Generate JaCoCo coverage for unit tests (createOpenDebugUnitTestCoverageReport).
            enableUnitTestCoverage true
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs << "-Xlint:deprecation" << "-Xlint:unchecked"
    }
    kotlin {
        compilerOptions {
            jvmTarget.set(JvmTarget.JVM_11)
        }
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    testOptions {
        unitTests {
            // Let android.util.Log calls return defaults instead of throwing in JVM unit tests.
            returnDefaultValues = true
        }
    }
    packaging {
        jniLibs {
            // WpsConnectionLibrary executes bundled helper binaries from the app's nativeLibDir.
            useLegacyPackaging = true
        }
    }
    flavorDimensions += "version"
    productFlavors {
        open {
            dimension = "version"
            applicationId = "sangiorgi.wps.opensource"

            resValue "string", "app_name", "Wps Wpa Tester OpenSource"
            buildConfigField "String", "DATA_DIR", "\"/data/data/sangiorgi.wps.opensource/\""
        }
    }
}

dependencies {

    implementation libs.androidx.core.ktx
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.activity.compose
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.ui
